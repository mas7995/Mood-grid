<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Mood Grid</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>The Mood Grid</h1>
    <p class="tagline">
      Every evening, check in with yourself. How did you feel by the end of the
      day? Pick a mood, color in the day, and watch your growth over time.
    </p>
  </header>

  <main>
    <!-- Controls -->
    <section class="controls">
      <div class="year-nav">
        <button id="prevYear" class="nav-btn" aria-label="Previous year">&larr;</button>
        <h2 id="yearLabel">2026</h2>
        <button id="nextYear" class="nav-btn" aria-label="Next year">&rarr;</button>
      </div>

      <div class="palette" role="radiogroup" aria-label="Choose a mood">
        <!-- Mood buttons injected by JS -->
      </div>

      <div class="tools">
        <button id="todayBtn" class="tool-btn">Log Today</button>
        <button id="exportBtn" class="tool-btn">Export</button>
        <button id="importBtn" class="tool-btn">Import</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </section>

    <!-- Grid -->
    <section id="grid" class="grid" aria-label="Mood grid for the year"></section>

    <!-- Stats -->
    <section id="stats" class="stats" aria-label="Mood summary"></section>
  </main>

  <footer class="site-footer">
    <p>Inspired by Step 4: The Mood Grid &mdash; your data stays on this device.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
